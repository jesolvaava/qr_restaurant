<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables - QR Restaurant</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background: #f5f5f5;
        }

        /* Header Section */
        .header {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            margin: 0;
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #2d2d2d;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-secondary {
            background: #4a4a4a;
            color: white;
        }

        .btn-secondary:hover {
            background: #3a3a3a;
        }

        /* Tables Grid */
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .table-card:hover {
            transform: translateY(-5px);
        }

        .table-number {
            font-size: 2.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 1rem;
        }

        .table-status {
            font-size: 1rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .menu-button {
            background: #4a4a4a;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .menu-button:hover {
            background: #3a3a3a;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #333;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .fab:hover {
            background: #2d2d2d;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>QR Restaurant</h1>
        <p>Scan. Order. Enjoy.</p>
    </header>

    <div class="nav-buttons">
        <a href="{% url 'home' %}" class="btn btn-secondary">Back to Home</a>
    </div>

    <div class="tables-grid">
        {% for table in tables %}
        <div class="table-card">
            <div class="table-number">Table {{ table.table_number }}</div>
            <div class="table-status">Ready for Service</div>
            <a href="{% url 'menu' table.table_number %}" class="menu-button">View Menu</a>
        </div>
        {% endfor %}
    </div>

    <a href="{% url 'home' %}" class="fab">
        <span style="font-size: 1.5rem;">🏠</span>
    </a>
</body>
</html>
